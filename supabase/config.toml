# Se usa para distinguir proyectos locales en el mismo host.
project_id = "env(PROJECT_ID)"

[api]
enabled = true
port = 54321
# SEGURETAT: Exposar "data" aquí converteix TOTES les taules data.* en endpoints
# REST directes accessibles per anon/authenticated, bypassant la capa api.*.
# Mai afegir "data" a aquesta llista. Usa RPCs SECURITY DEFINER a api.* per
# a operacions que necessiten accedir a data.* des de workers/Edge Functions.
schemas = ["api", "graphql_public"]
extra_search_path = ["api", "data", "public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./seeds/attendance_demo.sql"]

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.image_transformation]
enabled = true

# =============================================================================
# AUTH — configuración local (dev)
# Para staging/prod: configurar en Supabase Dashboard > Authentication > Settings
# =============================================================================
[auth]
enabled = true

# URL base del frontend principal (tenant-portal en dev)
site_url = "http://127.0.0.1:5173"

# URLs autorizadas para redirect OAuth — incluye ambos frontends locales
additional_redirect_urls = [
  "http://127.0.0.1:5173",
  "http://localhost:5173",
  "http://127.0.0.1:5173/auth/callback",
  "http://localhost:5173/auth/callback",
  "http://127.0.0.1:3000",
  "http://localhost:3000",
  "http://127.0.0.1:3000/auth/callback",
  "http://localhost:3000/auth/callback"
]

jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# En dev, desactivar confirmación de email para facilitar pruebas
enable_confirmations = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

# =============================================================================
# Google OAuth — las credenciales se leen de supabase/.env (NO commitear)
# Instrucciones: ver docs/01-supabase-local-setup.md sección 7
# =============================================================================
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/data/custom_access_token_hook"


