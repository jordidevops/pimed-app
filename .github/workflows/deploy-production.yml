# =============================================================================
# Deploy — Production
# =============================================================================
# Trigger:  push a la branca `main`
# Resultat: deploy de producció a Vercel → dominis admin / app
#
# Prerequisits: mateixos que deploy-staging.yml (Ignored Build Step: exit 0), a més:
#   · Configurar Branch Domains per a `main`:
#     · admin-portal:  admin.yourdomain.com → branca main
#     · tenant-portal: app.yourdomain.com   → branca main
#   · Configurar env vars a Vercel scope "Production":
#     · admin-portal:  NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY,
#                      DATABASE_URL, DIRECT_URL
#     · tenant-portal: VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY
#   · DNS Cloudflare — CNAME (proxy DESACTIVAT / núvol gris):
#     · admin  →  cname.vercel-dns.com
#     · app    →  cname.vercel-dns.com
#
# Recomanació: afegir un pas de migracions de Supabase abans del deploy:
#   supabase db push --linked --token $SUPABASE_ACCESS_TOKEN
#   (requereix SUPABASE_ACCESS_TOKEN als GitHub Secrets)
# =============================================================================

name: Deploy — Production

on:
  push:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Detecta quines apps han canviat
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      admin: ${{ steps.filter.outputs.admin }}
      tenant: ${{ steps.filter.outputs.tenant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            admin:
              - 'apps/admin-portal/**'
              - 'supabase/migrations/**'
              - '.github/workflows/deploy-production.yml'
            tenant:
              - 'apps/tenant-portal/**'
              - '.github/workflows/deploy-production.yml'

  # ---------------------------------------------------------------------------
  # Deploy admin-portal → admin.yourdomain.com
  # ---------------------------------------------------------------------------
  deploy-admin-portal:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/admin-portal/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Configure Vercel project
        run: |
          mkdir -p .vercel
          echo '{"orgId":"${{ secrets.VERCEL_ORG_ID }}","projectId":"${{ secrets.VERCEL_ADMIN_PROJECT_ID }}"}' > .vercel/project.json
        working-directory: apps/admin-portal

      - name: Pull environment variables (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/admin-portal

      - name: Inject public env vars (NEXT_PUBLIC_* must be present at build time)
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL_PROD }}" >> .env.production
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY_PROD }}" >> .env.production
        working-directory: apps/admin-portal

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/admin-portal

      - name: Deploy to Vercel (production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/admin-portal

  # ---------------------------------------------------------------------------
  # Deploy tenant-portal → app.yourdomain.com
  # ---------------------------------------------------------------------------
  deploy-tenant-portal:
    needs: changes
    if: needs.changes.outputs.tenant == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/tenant-portal/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Configure Vercel project
        run: |
          mkdir -p .vercel
          echo '{"orgId":"${{ secrets.VERCEL_ORG_ID }}","projectId":"${{ secrets.VERCEL_TENANT_PROJECT_ID }}"}' > .vercel/project.json
        working-directory: apps/tenant-portal

      - name: Pull environment variables (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/tenant-portal

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/tenant-portal

      - name: Deploy to Vercel (production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/tenant-portal
